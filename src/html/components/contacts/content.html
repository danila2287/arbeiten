<section class="section section--tight">
  <div class="container prose">
    <h1 class="page-title">Контакты</h1>
    <p>
      Удобнее всего — написать в мессенджер: пришлите список или фото того, что нужно, и дату.
      Ответим с ценой и наличием.
    </p>
    <dl class="specs specs--big">
      <div class="specs__row">
        <dt>Телефон</dt>
        <dd><a href="tel:{{phoneRaw}}">{{phone}}</a></dd>
      </div>
      <div class="specs__row">
        <dt>WhatsApp</dt>
        <dd><a href="https://wa.me/{{whatsapp}}" target="_blank" rel="noopener">Написать в WhatsApp</a></dd>
      </div>
      <div class="specs__row">
        <dt>Telegram</dt>
        <dd><a href="https://t.me/{{telegram}}" target="_blank" rel="noopener">@{{telegram}}</a></dd>
      </div>
      <div class="specs__row">
        <dt>Почта</dt>
        <dd><a href="mailto:{{email}}">{{email}}</a></dd>
      </div>
      <div class="specs__row">
        <dt>Авито</dt>
        <dd><a href="{{avito}}" target="_blank" rel="noopener">Профиль с отзывами</a></dd>
      </div>
      <div class="specs__row">
        <dt>Режим работы</dt>
        <dd>{{hours}}</dd>
      </div>
    </dl>
  </div>
</section>
